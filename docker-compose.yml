services:
  app:
    image: php-laravel
    container_name: tk_indria_app
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    working_dir: /var/www/html
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
      - redis

  db:
    image: mysql:8.0
    container_name: tk_indria_db
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: tk_indria_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin
    container_name: tk_indria_pma
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
    depends_on:
      - db

  redis:
    image: redis:alpine
    container_name: tk_indria_redis
    ports:
      - "6379:6379"

volumes:
  db_data: